name: Daily Channel Scan
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports and data directories
        run: mkdir -p reports data

      - name: Run channel scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv

      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config.user.name "GitHub Actions"
          git add channels.csv data/ reports/
          git diff --staged --quiet || git commit -m "📊 Daily channel scan report"
          git pull --rebase --autostash origin main
          git push origin main
