name: 🔄 Update Dependencies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Backup current go.mod and go.sum
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak

      - name: ⬆️ Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Generate statistics
        id: stats
        run: |
          ADDED=$(diff -u go.mod.bak go.mod | grep -E '^\+[^+]' | grep -v '^+++' | wc -l || echo "0")
          REMOVED=$(diff -u go.mod.bak go.mod | grep -E '^-[^-]' | grep -v '^---' | wc -l || echo "0")
          SUM_CHANGES=$(diff -u go.sum.bak go.sum | grep -E '^[+-]' | grep -v '^[+-][+-][+-]' | wc -l || echo "0")
          MOD_CHANGES=$(git diff --numstat go.mod | awk '{print $1+$2}' || echo "0")
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT
          echo "sum_changes=$SUM_CHANGES" >> $GITHUB_OUTPUT
          echo "mod_changes=$MOD_CHANGES" >> $GITHUB_OUTPUT

      - name: 📊 Build Markdown report
        run: |
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          ADDED="${{ steps.stats.outputs.added }}"
          REMOVED="${{ steps.stats.outputs.removed }}"
          MOD_CHANGES="${{ steps.stats.outputs.mod_changes }}"
          SUM_CHANGES="${{ steps.stats.outputs.sum_changes }}"
          DIFF_OUT=$(diff -u go.mod.bak go.mod | sed 's/^/  /')
          
          echo "# 📦 گزارش به‌روزرسانی وابستگی‌ها" > reports/deps_update_report.md
          echo "" >> reports/deps_update_report.md
          echo "**تاریخ اجرا:** ${NOW}" >> reports/deps_update_report.md
          echo "" >> reports/deps_update_report.md
          echo "## خلاصه آماری" >> reports/deps_update_report.md
          echo "| معیار | مقدار |" >> reports/deps_update_report.md
          echo "|-------|-------|" >> reports/deps_update_report.md
          echo "| وابستگی‌های اضافه شده (خطوط + در go.mod) | ${ADDED} |" >> reports/deps_update_report.md
          echo "| وابستگی‌های حذف شده (خطوط - در go.mod) | ${REMOVED} |" >> reports/deps_update_report.md
          echo "| خطوط تغییر یافته در go.mod | ${MOD_CHANGES} |" >> reports/deps_update_report.md
          echo "| تغییرات در go.sum | ${SUM_CHANGES} |" >> reports/deps_update_report.md
          echo "" >> reports/deps_update_report.md
          echo "## جزئیات تغییرات (go.mod)" >> reports/deps_update_report.md
          echo "\`\`\`diff" >> reports/deps_update_report.md
          echo "${DIFF_OUT}" >> reports/deps_update_report.md
          echo "\`\`\`" >> reports/deps_update_report.md
          echo "" >> reports/deps_update_report.md
          echo "---" >> reports/deps_update_report.md
          echo "✅ گزارش توسط GitHub Actions تولید شده است." >> reports/deps_update_report.md
          
          cat reports/deps_update_report.md

      - name: 💾 Commit and push changes including report
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add go.mod go.sum reports/deps_update_report.md
          git diff --staged --quiet || git commit -m "chore(deps): update dependencies (report included)"
          git push

      - name: Add summary to job
        run: |
          echo "## 📊 به‌روزرسانی وابستگی‌ها" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| معیار | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| اضافه شده | ${{ steps.stats.outputs.added }} |" >> $GITHUB_STEP_SUMMARY
          echo "| حذف شده | ${{ steps.stats.outputs.removed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| خطوط تغییر کرده در go.mod | ${{ steps.stats.outputs.mod_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| تغییرات در go.sum | ${{ steps.stats.outputs.sum_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ گزارش کامل در [reports/deps_update_report.md](https://github.com/${{ github.repository }}/blob/main/reports/deps_update_report.md) ذخیره شده است." >> $GITHUB_STEP_SUMMARY
