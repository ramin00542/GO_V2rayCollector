name: Update Dependencies & Code

on:
  schedule:
    - cron: "0 0 * * 0"   # هر یکشنبه ساعت 00:00
  workflow_dispatch:      # اجرای دستی

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      # به‌روزرسانی وابستگی‌های اصلی (ریشه)
      - name: Update main module dependencies
        run: |
          go get -u all
          go mod tidy

      # به‌روزرسانی وابستگی‌های اسکنرها (telegram-tester)
      - name: Update telegram-tester dependencies
        run: |
          cd telegram-tester
          go get -u all
          go mod tidy
          cd ..

      # commit و push تغییرات
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum telegram-tester/go.mod telegram-tester/go.sum
          git diff --staged --quiet || git commit -m "⬆️ Auto-update dependencies [skip ci]"
          git push
