name: Update Dependencies
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Update main module
        run: |
          go mod tidy
          go get -u ./...
          go mod tidy

      - name: Update telegram-tester module
        run: |
          cd telegram-tester
          # اگر go.mod وجود ندارد، ایجاد کن
          if [ ! -f go.mod ]; then
            go mod init telegram-tester
          fi
          go mod tidy
          go get -u ./...
          go mod tidy
          cd ..

      - name: Commit and push if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "⬆️ Auto-update dependencies"
          git push
