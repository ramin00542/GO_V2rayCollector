name: 🔄 Update Dependencies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Backup current go.mod and go.sum
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak

      - name: ⬆️ Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: 📊 Generate statistics using git diff
        id: stats
        run: |
          # تغییرات خطوط در go.mod
          MOD_ADDED=$(git diff --numstat go.mod.bak go.mod | awk '{print $1}' | grep -E '^[0-9]+$' || echo 0)
          MOD_REMOVED=$(git diff --numstat go.mod.bak go.mod | awk '{print $2}' | grep -E '^[0-9]+$' || echo 0)
          MOD_CHANGES=$((MOD_ADDED + MOD_REMOVED))
          
          # تغییرات در go.sum
          SUM_ADDED=$(git diff --numstat go.sum.bak go.sum | awk '{print $1}' | grep -E '^[0-9]+$' || echo 0)
          SUM_REMOVED=$(git diff --numstat go.sum.bak go.sum | awk '{print $2}' | grep -E '^[0-9]+$' || echo 0)
          SUM_CHANGES=$((SUM_ADDED + SUM_REMOVED))
          
          # آمار اضافه/حذف خطوط (تخمینی)
          ADDED=$MOD_ADDED
          REMOVED=$MOD_REMOVED
          
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT
          echo "mod_changes=$MOD_CHANGES" >> $GITHUB_OUTPUT
          echo "sum_changes=$SUM_CHANGES" >> $GITHUB_OUTPUT

      - name: 📝 Prepare formatted diff
        id: diff
        run: |
          # ایجاد diff زیبا برای go.mod (فقط در صورت وجود تغییر)
          if git diff --quiet go.mod.bak go.mod; then
            DIFF_TEXT="(هیچ تغییری در go.mod مشاهده نشد)"
          else
            DIFF_TEXT=$(git diff --no-index --color=never go.mod.bak go.mod | sed 's/^/    /')
          fi
          echo "diff_text<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📄 Build Markdown report
        run: |
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          ADDED="${{ steps.stats.outputs.added }}"
          REMOVED="${{ steps.stats.outputs.removed }}"
          MOD_CHANGES="${{ steps.stats.outputs.mod_changes }}"
          SUM_CHANGES="${{ steps.stats.outputs.sum_changes }}"
          
          cat > reports/deps_update_report.md << 'EOF'
          # 📦 گزارش به‌روزرسانی وابستگی‌ها
          
          **تاریخ اجرا:** $NOW
          
          ## خلاصه آماری
          | معیار | مقدار |
          |-------|-------|
          | وابستگی‌های اضافه شده (خطوط + در go.mod) | $ADDED |
          | وابستگی‌های حذف شده (خطوط - در go.mod) | $REMOVED |
          | خطوط تغییر یافته در go.mod | $MOD_CHANGES |
          | تغییرات در go.sum | $SUM_CHANGES |
          
          ## جزئیات تغییرات (go.mod)
