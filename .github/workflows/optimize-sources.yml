name: Optimize Sources (Channels & Subscriptions)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run channel_scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv

      - name: Run sources_checker
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv Sources.json \
                  dead_channels.txt dead_channels_archive.txt \
                  dead_sources.txt dead_sources_archive.txt \
                  scan_cache.json reports/
          git diff --staged --quiet || git commit -m "🧹 Weekly source optimization + reports"
          git push
