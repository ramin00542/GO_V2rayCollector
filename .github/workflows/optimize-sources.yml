name: Optimize Sources (Channels & Subscriptions)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Install deps
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..
      - name: Run channel scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv -concurrency 10
          cd ..
      - name: Copy auxiliary files
        run: |
          cp telegram-tester/dead_channels.txt dead_channels.txt 2>/dev/null || true
          cp telegram-tester/dead_channels_archive.txt dead_channels_archive.txt 2>/dev/null || true
          cp telegram-tester/scan_cache.json scan_cache.json 2>/dev/null || true
      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv dead_channels.txt dead_channels_archive.txt scan_cache.json
          git diff --staged --quiet || git commit -m "Weekly channel optimization"
          git push
