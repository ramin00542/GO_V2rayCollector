name: Optimize Sources (Channels & Subscriptions)

on:
  schedule:
    - cron: "0 0 * * 0"   # هر یکشنبه ساعت 00:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Run channel_scanner (update channels.csv)
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv

      - name: Run sources_checker (update Sources.json)
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json

      - name: Commit and push changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ../channels.csv ../Sources.json \
                  ../dead_channels.txt ../dead_channels_archive.txt \
                  ../dead_sources.txt ../dead_sources_archive.txt \
                  ../channels_report.md ../sources_report.md \
                  ../scan_cache.json
          git diff --staged --quiet || git commit -m "🧹 Weekly source optimization"
          git push
