name: Optimize Sources (Channels & Subscriptions)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create directories
        run: mkdir -p reports data

      - name: Run channel_scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv

      - name: Run sources_checker
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # دریافت آخرین تغییرات ریموت و rebase
          git pull --rebase origin main
          # اضافه کردن فایل‌های جدید
          git add channels.csv Sources.json data/ reports/
          # اگر تغییری وجود داشت commit کن
          git diff --staged --quiet || git commit -m "🧹 Weekly source optimization"
          # push به ریموت
          git push origin main
