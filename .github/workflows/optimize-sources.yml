name: Optimize Sources (Channels & Subscriptions)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"     # هر یکشنبه ساعت 00:00

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Install dependencies
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..

      - name: Run channel scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go ../channels.csv
          cd ..

      - name: Copy auxiliary files to root
        run: |
          cp telegram-tester/dead_channels.txt dead_channels.txt 2>/dev/null || true
          cp telegram-tester/dead_channels_archive.txt dead_channels_archive.txt 2>/dev/null || true
          cp telegram-tester/scan_report.txt scan_report.txt 2>/dev/null || true

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add channels.csv dead_channels.txt dead_channels_archive.txt scan_report.txt
          git diff --staged --quiet || git commit -m "🤖 Weekly channel optimization & archive update"
          git push
