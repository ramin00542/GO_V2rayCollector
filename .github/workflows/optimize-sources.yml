name: Optimize Sources (Channels & Subscriptions)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"     # هر یکشنبه ساعت 00:00

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Install dependencies for scanners
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..

      - name: Run channel scanner
        run: |
          cd telegram-tester
          go run channel_scanner.go ../channels.csv
          cd ..

      - name: Run source checker
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json
          cd ..

      - name: Copy reports to stats folder
        run: |
          mkdir -p stats
          cp telegram-tester/scan_report.md stats/ 2>/dev/null || true
          cp telegram-tester/sources_report.md stats/ 2>/dev/null || true
          cp telegram-tester/dead_channels.txt stats/ 2>/dev/null || true
          cp telegram-tester/dead_channels_archive.txt stats/ 2>/dev/null || true
          cp telegram-tester/dead_sources.txt stats/ 2>/dev/null || true
          cp telegram-tester/dead_sources_archive.txt stats/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add channels.csv Sources.json stats/
          git diff --staged --quiet || git commit -m "🤖 Weekly optimization: clean dead channels/sources"
          git push
