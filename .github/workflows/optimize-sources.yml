name: Optimize Sources (Channels & Subscriptions)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"     # هر یکشنبه ساعت 00:00 (هفتگی)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Install dependencies for scanners
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..

      - name: Run channel scanner (optimize channels.csv)
        run: |
          cd telegram-tester
          go run channel_scanner.go ../channels.csv
          echo "Channel scanner finished. Updated channels.csv"
          cd ..

      - name: Run subscription source checker (optimize Sources.json)
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json
          echo "Source checker finished. Updated Sources.json"
          cd ..

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add channels.csv Sources.json dead_channels.txt dead_sources.txt scan_report.txt sources_report.txt
          git diff --staged --quiet || git commit -m "🤖 Weekly optimization: clean dead channels/sources"
          git push
