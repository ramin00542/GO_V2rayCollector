name: Yearly Scan of Very Old Dead Items
on:
  schedule:
    - cron: "0 0 1 1 *"   # هر سال 1 ژانویه ساعت 00:00
  workflow_dispatch:

jobs:
  yearly-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Create directories
        run: mkdir -p reports data
      - name: Scan old channels
        run: |
          cd telegram-tester
          go run channel_scanner.go -input ../channels.csv -output ../channels.csv -old-scan
      - name: Scan old sources
        run: |
          cd telegram-tester
          go run sources_checker.go ../Sources.json -old-scan
      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config.user.name "GitHub Actions"
          git pull --rebase origin main
          git add channels.csv Sources.json data/ reports/
          git diff --staged --quiet || git commit -m "📅 Yearly scan of very old dead items"
          git push origin main
