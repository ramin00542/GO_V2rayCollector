name: telegram-test
on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Run Telegram Tester
        run: |
          cd telegram-tester
          go mod init telegram-tester
          go get github.com/PuerkitoBio/goquery
          go run main.go
