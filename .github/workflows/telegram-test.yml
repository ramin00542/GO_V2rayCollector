name: telegram-test
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Run Telegram Tester
        run: |
          cd telegram-tester
          go run main.go 2>&1 | tee ../telegram_test_output.txt

      - name: Commit and push output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add telegram_test_output.txt
          git diff --staged --quiet || git commit -m "Add telegram test output"
          git push
