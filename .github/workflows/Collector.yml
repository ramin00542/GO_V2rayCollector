name: Collector
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '>=1.21.3'
    - run: go version

    - name: Build and run Golang file
      run: |
        go build -o myapp
        ./myapp -sort

    - name: Commit Changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git pull origin main --rebase --autostash
        # اضافه کردن پوشه‌های جدید و فایل cache
        git add telegram/ subscription/ mixed/ daily_archive/ config_cache.json
        git diff --staged --quiet || git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Collected"

    - name: Push Changes
      uses: ad-m/github-push-action@v1.1.0
      with:
        branch: main
        github_token: ${{ secrets.GITHUB_TOKEN }}
