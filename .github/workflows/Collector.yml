name: Collector
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Display Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build Go app
        run: go build -v -o myapp

      - name: Run collector (with debug and full log)
        run: |
          export DEBUG=true
          ./myapp -sort -clash -fork-scan 2>&1 | tee collector_full.log
          echo "===== FULL LOG (first 200 lines) ====="
          head -n 200 collector_full.log
          echo "===== END OF LOG SAMPLE ====="
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: 'myapp'

      - name: Add statistics to job summary
        run: |
          echo "## 📊 Collector Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f collector_stats.md ]; then
            cat collector_stats.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No statistics file generated yet." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📄 Full log (first 200 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 200 collector_full.log 2>/dev/null || echo "Log not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add telegram/ subscription/ mixed/ daily_archive/ all_configs/ config_cache.json clash-config.yaml stats.json go.sum links.txt links.md collector_stats.txt collector_stats.md subscription_links.txt collector_full.log
          git diff --staged --quiet || git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Collected"

      - name: Push changes
        uses: ad-m/github-push-action@v1.1.0
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: false
