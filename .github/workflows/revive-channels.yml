name: Revive Channels from Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # هر روز ساعت 3 بامداد

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Install dependencies
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..

      - name: Run revive scanner
        run: |
          cd telegram-tester
          go run revive_scanner.go
          cd ..

      - name: Copy reports to stats folder
        run: |
          mkdir -p stats
          cp telegram-tester/revive_report.md stats/ 2>/dev/null || true
          cp telegram-tester/revive_cache.json stats/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add stats/ channels.csv
          git diff --staged --quiet || git commit -m "🔄 Daily revive check"
          git push
