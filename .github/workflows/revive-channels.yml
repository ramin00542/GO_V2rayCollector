name: Revive Channels from Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Create directories
        run: mkdir -p reports data
      - name: Run revive scanner
        run: |
          cd telegram-tester
          go run revive_scanner.go
      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config.user.name "GitHub Actions"
          git add channels.csv data/ reports/
          git diff --staged --quiet || git commit -m "🔄 Daily revive check"
          git pull --rebase --autostash origin main
          git push origin main
