name: Revive Channels from Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Install deps
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
          cd ..
      - name: Run revive scanner
        run: |
          cd telegram-tester
          go run revive_scanner.go
          cd ..
      - name: Copy output files
        run: |
          cp telegram-tester/revive_cache.json revive_cache.json 2>/dev/null || true
      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv dead_channels_archive.txt revive_cache.json
          git diff --staged --quiet || git commit -m "Daily revive check"
          git push
