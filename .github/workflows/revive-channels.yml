name: Revive Channels from Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # هر روز ساعت 3 بامداد

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run revive scanner
        run: |
          cd telegram-tester
          go run revive_scanner.go

      - name: Commit and push changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv reports/ revive_cache.json
          git diff --staged --quiet || git commit -m "🔄 Daily revive check"
          git push
