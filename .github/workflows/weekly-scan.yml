name: Weekly Re-check Blocked
on:
  schedule:
    - cron: "0 3 * * 0"   # هر یکشنبه
  workflow_dispatch:
jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Install deps
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
      - name: Re-check blocked channels and sources
        run: |
          cd telegram-tester
          # اسکنرها همان اسکریپت‌های معمولی هستند – خودشان blocked list را به‌روز می‌کنند
          go run channel_scanner.go ../channels.csv ../channels_new.csv
          go run sources_checker.go ../Sources.json ../sources_report.csv
      - name: Update optimized files
        run: |
          cp telegram-tester/channels_new.csv channels.csv
          cp telegram-tester/Sources_valid.json Sources.json
          cp telegram-tester/blocked_channels.txt blocked_channels.txt
          cp telegram-tester/blocked_sources.txt blocked_sources.txt
      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv Sources.json blocked_channels.txt blocked_sources.txt
          git diff --staged --quiet || git commit -m "Weekly revive check for blocked sources"
          git push
