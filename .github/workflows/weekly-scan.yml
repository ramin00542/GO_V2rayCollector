name: Weekly Re-check Blocked
on:
  schedule:
    - cron: "0 4 * * 0"   # هر یکشنبه ساعت 4 بامداد
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'
      - name: Install deps
        run: |
          cd telegram-tester
          go mod init telegram-tester 2>/dev/null || true
          go get github.com/PuerkitoBio/goquery
      - name: Re-check blocked channels and sources
        run: |
          cd telegram-tester
          go run channel_scanner.go ../channels.csv
          go run sources_checker.go ../Sources.json
      - name: Update optimized files
        run: |
          mkdir -p stats
          cp telegram-tester/scan_report.md stats/ 2>/dev/null || true
          cp telegram-tester/sources_report.md stats/ 2>/dev/null || true
          cp telegram-tester/dead_channels.txt stats/ 2>/dev/null || true
          cp telegram-tester/dead_sources.txt stats/ 2>/dev/null || true
      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add channels.csv Sources.json stats/
          git diff --staged --quiet || git commit -m "Weekly revive check for blocked sources"
          git push
