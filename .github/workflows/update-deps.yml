name: Update Dependencies

on:
  schedule:
    - cron: "0 0 * * 0"   # هر یکشنبه
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.3'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Backup current go.mod and go.sum
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak

      - name: Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Generate statistics
        id: stats
        run: |
          # محاسبه خطوط اضافه/حذف شده در go.mod
          ADDED=$(diff -u go.mod.bak go.mod | grep -E '^\+[^+]' | grep -v '^+++' | wc -l || echo "0")
          REMOVED=$(diff -u go.mod.bak go.mod | grep -E '^-[^-]' | grep -v '^---' | wc -l || echo "0")
          # تغییرات go.sum تقریبی
          SUM_CHANGES=$(diff -u go.sum.bak go.sum | grep -E '^[+-]' | grep -v '^[+-][+-][+-]' | wc -l || echo "0")
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT
          echo "sum_changes=$SUM_CHANGES" >> $GITHUB_OUTPUT

          # گرفتن لیست ماژول‌های به‌روز شده (غیر مستقیم)
          MOD_CHANGES=$(git diff --numstat go.mod | awk '{print $1+$2}' || echo "0")
          echo "mod_changes=$MOD_CHANGES" >> $GITHUB_OUTPUT

      - name: Build Markdown report
        run: |
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          cat > reports/deps_update_report.md << EOF
  # 📦 گزارش به‌روزرسانی وابستگی‌ها

  **تاریخ اجرا:** $NOW

  ## خلاصه آماری
  | معیار | مقدار |
  |-------|-------|
  | وابستگی‌های اضافه شده (خطوط + در go.mod) | ${{ steps.stats.outputs.added }} |
  | وابستگی‌های حذف شده (خطوط - در go.mod) | ${{ steps.stats.outputs.removed }} |
  | خطوط تغییر یافته در go.mod | ${{ steps.stats.outputs.mod_changes }} |
  | تغییرات در go.sum | ${{ steps.stats.outputs.sum_changes }} |

  ## جزئیات تغییرات (go.mod)

  \`\`\`diff
  $(diff -u go.mod.bak go.mod | sed 's/^/  /')
  \`\`\`

  ---
  ✅ گزارش توسط GitHub Actions تولید شده است.
  EOF
          cat reports/deps_update_report.md

      - name: Commit and push changes including report
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add go.mod go.sum reports/deps_update_report.md
          git diff --staged --quiet || git commit -m "chore(deps): update dependencies (report included)"
          git push

      - name: Add summary to job
        run: |
          echo "## 📊 به‌روزرسانی وابستگی‌ها" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| معیار | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| اضافه شده | ${{ steps.stats.outputs.added }} |" >> $GITHUB_STEP_SUMMARY
          echo "| حذف شده | ${{ steps.stats.outputs.removed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| خطوط تغییر کرده در go.mod | ${{ steps.stats.outputs.mod_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| تغییرات در go.sum | ${{ steps.stats.outputs.sum_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ گزارش کامل در [reports/deps_update_report.md](https://github.com/${{ github.repository }}/blob/main/reports/deps_update_report.md) ذخیره شده است." >> $GITHUB_STEP_SUMMARY
